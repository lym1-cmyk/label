#title { position: absolute; left: 36px; top: 18px; font-size: 34px; font-weight: 700; color: #5a4331; letter-spacing: 1px; }
#hint { position: absolute; left: 560px; top: 34px; font-size: 18px; color: #8a7663; }
#reset { position: absolute; right: 36px; top: 18px; width: 116px; height: 50px; border-radius: 16px; border: 2.5px solid #e6b98a;
  background: #fff8ee; font: inherit; font-size: 22px; font-weight: 600; color: #6b4d33; cursor: pointer; box-shadow: 0 4px 10px rgba(120,80,40,.12); }
#reset:hover { background: #fff1de; }
#reset:active { transform: translateY(1px); }
#progress { position: absolute; left: 36px; bottom: 22px; padding: 8px 18px; border-radius: 22px; background: rgba(255,255,255,.75);
  font-size: 20px; font-weight: 500; color: #6b5642; box-shadow: 0 2px 6px rgba(120,80,40,.1); }
#bottle { position: absolute; left: 516px; top: 160px; width: 568px; height: 722px; pointer-events: none; }
#shadow { position: absolute; left: 570px; top: 862px; width: 460px; height: 30px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(90,55,25,.22), rgba(90,55,25,0) 70%); }
#label { position: absolute; left: 622px; top: 400px; width: 316px; height: 358px; pointer-events: none; }
.line { position: absolute; left: 30px; white-space: nowrap; transform: translateY(-50%); color: #3d3026; }
svg { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; pointer-events: none; overflow: visible; }
.zone { position: absolute; width: 300px; height: 62px; border-radius: 18px; background: rgba(255,255,255,.55);
  border: 2px dashed #c8b496; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #b8a68d; transition: background .15s, border-color .15s; }
.zone.hover { border-width: 3px; }
.zone.filled { border-color: transparent; color: transparent; }
.zone.wrong { animation: wrongflash .6s ease-out; }
@keyframes wrongflash { 0%,40% { background: #fde3e1; border-color: #e0605a; } 100% { background: rgba(255,255,255,.55); } }
.chip { position: absolute; height: 58px; padding: 0 22px; border-radius: 18px; background: #fffaf2; border: 2.5px solid #eadcc6;
  display: flex; align-items: center; font-size: 23px; font-weight: 600; color: #4a3a2c; white-space: nowrap; cursor: grab;
  box-shadow: 0 5px 12px rgba(120,80,40,.14); touch-action: none; z-index: 5; }
.chip.dragging { cursor: grabbing; z-index: 20; box-shadow: 0 14px 26px rgba(120,80,40,.25); transform: scale(1.06); }
.chip.animating { transition: left .32s cubic-bezier(.3,1.4,.5,1), top .32s cubic-bezier(.3,1.4,.5,1); }
.chip.locked { cursor: default; animation: bounce .45s ease-out; }
.chip.shake { animation: shake .35s ease-in-out; border-color: #e0605a; }
@keyframes bounce { 0% { transform: scale(1.16); } 45% { transform: scale(.95); } 75% { transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { margin-left: 0; } 20% { margin-left: -9px; } 40% { margin-left: 9px; } 60% { margin-left: -6px; } 80% { margin-left: 6px; } }
.guide { fill: none; stroke: #8f7a66; stroke-width: 2.5; stroke-dasharray: 7 5; stroke-linecap: round; stroke-linejoin: round; }
.solid { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
#overlay { position: absolute; inset: 0; background: rgba(80,60,40,.28); display: none; align-items: center; justify-content: center; z-index: 50; }
#overlay.show { display: flex; animation: fadein .3s ease-out; }
#card { background: #fffaf1; border: 3px solid #f0b56a; border-radius: 28px; padding: 38px 46px 30px; text-align: center;
  box-shadow: 0 20px 50px rgba(90,60,30,.25); animation: pop .45s cubic-bezier(.3,1.5,.5,1); }
#card .msg { font-size: 34px; font-weight: 700; color: #4a3a2c; }
#card .btns { margin-top: 26px; display: flex; gap: 24px; justify-content: center; }
#card button { min-width: 160px; height: 54px; border-radius: 16px; font: inherit; font-size: 22px; font-weight: 600; cursor: pointer; border: 2.5px solid #e2d3bd; background: #fff; color: #5a4331; }
#card button.primary { background: #ffe8c7; border-color: #f0b56a; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>

  drug:      { side: "left",  lines: [4],       mark: "underline", y: 545, color: "#5fb6e0", answer: "Chlorpheniramine 2mg/5ml", seg: ["seg-drug-a", "seg-dose"] },
  frequency: { side: "left",  lines: [6],       mark: "underline", y: 690, color: "#ec8fa8", answer: "每天 4 次、每次 5 毫升", seg: ["seg-frequency"] },
  patient:   { side: "right", lines: [2],       mark: "underline", y: 400, color: "#8b9fdc", answer: "陳一心", seg: ["seg-patient"] },
  date:      { side: "right", lines: [3],       mark: "underline", y: 490, color: "#5fbfae", answer: "2026/10/18", seg: ["seg-date"] },
  dose:      { side: "right", lines: [4],       mark: "underline", y: 585, color: "#eab52a", answer: "2mg/5ml", seg: ["seg-dose"], offset: 19 },
  notes:     { side: "right", lines: [7, 8, 9], mark: "bracket",   y: 712, color: "#82bd5e", answer: "飽肚服、使用前搖勻、服後有睡意" },
};
const LABEL = { x: 622, y: 400, w: 316, h: 358, padTop: 12, padBottom: 10 };
const ZONE_W = 300, ZONE_H = 62, ZONE_GAP = 72;
const SVGNS = "http://www.w3.org/2000/svg";

const stage = document.getElementById("stage");
const labelEl = document.getElementById("label");
const svg = document.getElementById("lines");
const zonesEl = document.getElementById("zones");
const chipsEl = document.getElementById("chips");
const progressEl = document.getElementById("progress");
const overlay = document.getElementById("overlay");
let scale = 1;
const lineY = [];
const zoneRects = {};
const chips = {};
const matched = new Set();
const solidPaths = {};

function fit() {
  scale = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
  stage.style.transform = `scale(${scale})`;
  stage.style.left = (window.innerWidth - 1600 * scale) / 2 + "px";
  stage.style.top = (window.innerHeight - 900 * scale) / 2 + "px";
}

function buildLabel() {
  const step = (LABEL.h - LABEL.padTop - LABEL.padBottom) / LINES.length;
  LINES.forEach((line, i) => {
    const y = LABEL.padTop + step * (i + 0.5);
    lineY.push(LABEL.y + y);
    const div = document.createElement("div");
    div.className = "line";
    div.style.top = y + "px";
    div.style.fontSize = line.size + "px";
    div.style.fontWeight = line.weight;
    if (line.muted) div.style.color = "#857565";
    line.parts.forEach(([text, id]) => {
      const span = document.createElement("span");
      span.textContent = text;
      if (id) span.id = id;
      div.appendChild(span);
    });
    labelEl.appendChild(div);
  });
}

// Horizontal extent (stage coordinates) of a segment or a whole line.
function spanOf(ids) {
  let left = Infinity, right = -Infinity;
  ids.forEach(id => {
    const el = document.getElementById(id);
    let x = el.offsetLeft + el.parentElement.offsetLeft + LABEL.x;
    let w = el.offsetWidth;
    if (id === "seg-drug-a") w -= 6; // trailing space
    left = Math.min(left, x); right = Math.max(right, x + w);
  });
  return [left, right];
}
function lineRight(i) {
  const div = labelEl.children[i];
  return LABEL.x + div.offsetLeft + div.offsetWidth;
}
function midY(zone) { return (lineY[zone.lines[0]] + lineY[zone.lines[zone.lines.length - 1]]) / 2; }

// Point on the label where the connector ends.
function labelPoint(id) {
  const z = ZONES[id];
  if (z.side === "left") return [LABEL.x + 16, midY(z)];
  let right;
  if (z.seg) right = spanOf(z.seg)[1];
  else right = Math.max(...z.lines.map(lineRight));
  return [right + (z.mark === "bracket" ? 22 : 16), midY(z)];
}

function pathFor(id) {
  const z = ZONES[id], r = zoneRects[id];
  const sx = z.side === "left" ? r.x + r.w : r.x, sy = r.y + r.h / 2;
  const [tx, ty] = labelPoint(id);
  const ex = z.side === "left" ? LABEL.x - 34 : LABEL.x + LABEL.w + 46;
  let d = `M${sx},${sy} L${ex},${sy} L${ex},${ty} L${tx},${ty}`;
  // Mark on the text itself: bracket around several lines, or underline under a segment.
  if (z.mark === "bracket") {
    const top = lineY[z.lines[0]] - 13, bottom = lineY[z.lines[z.lines.length - 1]] + 13;
    const tick = z.side === "left" ? 8 : -8;
    d += ` M${tx + tick},${top} L${tx},${top} L${tx},${bottom} L${tx + tick},${bottom}`;
  } else {
    const [a, b] = spanOf(z.seg);
    const uy = lineY[z.lines[0]] + (z.offset || 14);
    if (z.side === "left") d += ` M${tx},${ty} L${a - 4},${ty}`;
    else d += ` M${b + 3},${ty} L${tx},${ty}`;
    d += ` M${a},${uy} L${b},${uy}`;
  }
  return d;
}

function buildZones() {
  Object.entries(ZONES).forEach(([id, z]) => {
    const x = z.side === "left" ? LABEL.x - ZONE_GAP - ZONE_W : LABEL.x + LABEL.w + ZONE_GAP;
    const rect = { x, y: z.y - ZONE_H / 2, w: ZONE_W, h: ZONE_H };
    zoneRects[id] = rect;
    const el = document.createElement("div");
    el.className = "zone";
    el.dataset.id = id;
    el.textContent = "放在這裡";
    Object.assign(el.style, { left: rect.x + "px", top: rect.y + "px" });
    zonesEl.appendChild(el);
    rect.el = el;
    const d = pathFor(id);
    const guide = document.createElementNS(SVGNS, "path");
    guide.setAttribute("d", d); guide.setAttribute("class", "guide");
    svg.appendChild(guide);
    const solid = document.createElementNS(SVGNS, "path");
    solid.setAttribute("d", d); solid.setAttribute("class", "solid");
    solid.setAttribute("stroke", z.color); solid.style.opacity = 0;
    svg.appendChild(solid);
    solidPaths[id] = { solid, guide };
  });
}

function buildChips() {
  const gap = 18;
  const widths = CATEGORIES.map(c => {
    const el = document.createElement("div");
    el.className = "chip"; el.textContent = c.text; el.dataset.id = c.id;
    chipsEl.appendChild(el);
    chips[c.id] = { el, id: c.id, locked: false };
    return el.offsetWidth;
  });
  const total = widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1);
  let x = (1600 - total) / 2;
  CATEGORIES.forEach((c, i) => {
    const chip = chips[c.id];
    chip.home = { x, y: 84 };
    chip.w = widths[i]; chip.h = 58;
    place(chip, x, 84);
    x += widths[i] + gap;
    chip.el.addEventListener("pointerdown", e => startDrag(e, chip));
  });
}
function place(chip, x, y) { chip.x = x; chip.y = y; chip.el.style.left = x + "px"; chip.el.style.top = y + "px"; }

let drag = null;
function toStage(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
function startDrag(e, chip) {
  if (chip.locked || drag) return;
  e.preventDefault();
  unlockAudio();
  const p = toStage(e);
  chip.el.classList.remove("animating", "shake");
  chip.el.classList.add("dragging");
  chip.el.setPointerCapture(e.pointerId);
  drag = { chip, dx: p.x - chip.x, dy: p.y - chip.y, pointer: e.pointerId };
}
function zoneAt(p) {
  for (const [id, r] of Object.entries(zoneRects)) {
    if (matched.has(id)) continue;
    const pad = 14;
    if (p.x >= r.x - pad && p.x <= r.x + r.w + pad && p.y >= r.y - pad && p.y <= r.y + r.h + pad) return id;
  }
  return null;
}
function setHover(id) {
  Object.entries(zoneRects).forEach(([zid, r]) => {
    const on = zid === id;
    r.el.classList.toggle("hover", on);
    r.el.style.borderColor = on ? ZONES[zid].color : "";
    r.el.style.background = on ? ZONES[zid].color + "22" : "";
  });
}
window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pointer) return;
  const p = toStage(e);
  place(drag.chip, Math.max(-40, Math.min(1560 - drag.chip.w / 2, p.x - drag.dx)), Math.max(-20, Math.min(870, p.y - drag.dy)));
  setHover(zoneAt(p));
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.pointer) return;
  const chip = drag.chip;
  const p = toStage(e);
  drag = null;
  chip.el.classList.remove("dragging");
  setHover(null);
  const zone = zoneAt(p);
  if (!zone) { sendHome(chip, false); return; }
  if (zone === chip.id) lockChip(chip, zone);
  else wrongDrop(chip, zone);
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

function sendHome(chip, shake) {
  chip.el.classList.add("animating");
  place(chip, chip.home.x, chip.home.y);
  if (shake) {
    setTimeout(() => { chip.el.classList.add("shake"); }, 300);
    setTimeout(() => { chip.el.classList.remove("shake"); }, 700);
  }
  setTimeout(() => chip.el.classList.remove("animating"), 350);
}
function wrongDrop(chip, zone) {
  play("sfxBuzz");
  const el = zoneRects[zone].el;
  el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong");
  sendHome(chip, true);
}
function lockChip(chip, zone) {
  play("sfxClap");
  matched.add(zone);
  chip.locked = true;
  const r = zoneRects[zone], z = ZONES[zone];
  chip.el.classList.add("animating", "locked");
  chip.el.style.borderColor = z.color;
  chip.el.style.background = z.color + "26";
  place(chip, r.x + (r.w - chip.w) / 2, r.y + (r.h - chip.h) / 2);
  r.el.classList.add("filled");
  // Draw the coloured connector over the dashed guide.
  const { solid, guide } = solidPaths[zone];
  const len = solid.getTotalLength();
  solid.style.transition = "none";
  solid.style.strokeDasharray = len; solid.style.strokeDashoffset = len; solid.style.opacity = 1;
  solid.getBoundingClientRect();
  solid.style.transition = "stroke-dashoffset .6s ease-out";
  solid.style.strokeDashoffset = 0;
  setTimeout(() => { guide.style.opacity = 0; }, 600);
  progressEl.textContent = `已配對 ${matched.size} / 7`;
  if (matched.size === CATEGORIES.length) setTimeout(() => overlay.classList.add("show"), 900);
}

function reset() {
  matched.clear();
  overlay.classList.remove("show");
  Object.values(chips).forEach(chip => {
    chip.locked = false;
    chip.el.classList.remove("locked", "shake", "dragging", "animating");
    chip.el.style.borderColor = ""; chip.el.style.background = "";
    place(chip, chip.home.x, chip.home.y);
  });
  Object.entries(zoneRects).forEach(([id, r]) => {
    r.el.classList.remove("filled", "wrong");
    const { solid, guide } = solidPaths[id];
    solid.style.transition = "none"; solid.style.opacity = 0; guide.style.opacity = 1;
  });
  setHover(null);
  progressEl.textContent = "已配對 0 / 7";
}

let audioReady = false;
function unlockAudio() {
  if (audioReady) return;
  audioReady = true;
  ["sfxClap", "sfxBuzz"].forEach(id => { const a = document.getElementById(id); a.load(); });
}
function play(id) {
  const a = document.getElementById(id);
  try { a.currentTime = 0; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
}

document.getElementById("reset").addEventListener("click", reset);
document.getElementById("again").addEventListener("click", reset);
document.getElementById("review").addEventListener("click", () => overlay.classList.remove("show"));
window.addEventListener("resize", fit);

function init() { fit(); buildLabel(); buildZones(); buildChips(); }
(document.fonts && document.fonts.ready ? document.fonts.load('600 23px "MedHK"').then(() => document.fonts.ready) : Promise.resolve()).then(init, init);
</script>
</body>
</html>
